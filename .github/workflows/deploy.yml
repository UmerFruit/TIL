name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /path/to/TIL
            git pull
            # Build sandbox image if Dockerfile changed
            if git diff HEAD@\{1\} -- sandbox-images/ | grep -q .; then
              cd sandbox-images && ./build.sh && cd ..
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            # Health check
            docker compose -f docker-compose.prod.yml exec -T app \
              node -e "fetch('http://localhost:3000/health').then(r=>r.text()).then(t=>{if(!r.ok)process.exit(1);console.log(t)})"